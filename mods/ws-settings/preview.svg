  <g transform="translate(220 324.5) scale(0.625)" fill="none" stroke="#7d8089" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></g>
  <text x="245" y="337" fill="#a5a8ae" font-size="13.5">Privacy</text>
  <rect x="210" y="350" width="170" height="32" rx="7" fill="#2a2b30"/>
  <g transform="translate(220 358.5) scale(0.625)" fill="none" stroke="#5b8def" stroke-width="2.00" stroke-linecap="round" stroke-linejoin="round"><line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/><line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/><line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/><line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/><line x1="16" x2="16" y1="18" y2="22"/></g>
  <text x="245" y="371" fill="#e8e9eb" font-size="13.5">Extras</text>
  <rect x="210" y="662" width="170" height="32" rx="7" fill="#2a2b30" stroke="#303237"/><text x="222" y="683" fill="#e8e9eb" font-size="13">Send feedback</text>
  <text x="419" y="126" fill="#7d8089" font-size="12" font-weight="600" letter-spacing="0.4">EXPERIMENTAL</text>
  <text x="419" y="150" fill="#7d8089" font-size="12.5">Features that lean on things other programs don't promise to keep the same. Each is off until you turn it on,</text>
  <text x="419" y="168" fill="#7d8089" font-size="12.5">and says why it's experimental.</text>
  <text x="419" y="206" fill="#e8e9eb" font-size="14">Wipe Antigravity conversations</text>
  <text x="419" y="228" fill="#7d8089" font-size="12.5">Adds Wipe session… to an Antigravity agent's right-click menu in the Agents list: it</text>
  <text x="419" y="246" fill="#7d8089" font-size="12.5">closes the agent, takes the conversation out of Antigravity's own lists and moves its</text>
  <text x="419" y="264" fill="#7d8089" font-size="12.5">files into ~/.herdr/trash, so History and Antigravity's /resume no longer show it.</text>
  <text x="419" y="284" fill="#a5a8ae" font-size="12">Why it's experimental: it edits Antigravity's own index files, whose format isn't</text>
  <text x="419" y="301" fill="#a5a8ae" font-size="12">documented: an Antigravity update could change them. It refuses what it can't read,</text>
  <text x="419" y="318" fill="#a5a8ae" font-size="12">keeps a copy in ~/.herdr/trash first, and waits while another Antigravity runs.</text>
  <rect x="1016" y="248.0" width="36" height="20" rx="10" fill="#5b8def"/><circle cx="1042" cy="258.0" r="8" fill="#fff"/>
  <rect x="419" y="334" width="633" height="1" fill="#303237"/>
  <text x="419" y="374" fill="#7d8089" font-size="12" font-weight="600" letter-spacing="0.4">SWITCHES</text>
  <text x="419" y="410" fill="#e8e9eb" font-size="14">Keep running while Herdr is closed</text>
  <text x="419" y="432" fill="#7d8089" font-size="12.5">Automations and board cards' pull requests are followed by a background process</text>
  <text x="419" y="450" fill="#7d8089" font-size="12.5">herdr-core keeps going. Off, Herdr runs them itself while it's open.</text>
  <text x="419" y="470" fill="#a5a8ae" font-size="12">Also at the foot of Automations.</text>
  <rect x="1016" y="426.0" width="36" height="20" rx="10" fill="#5b8def"/><circle cx="1042" cy="436.0" r="8" fill="#fff"/>
  <rect x="419" y="486" width="633" height="1" fill="#303237"/>
  <text x="419" y="516" fill="#e8e9eb" font-size="14">Bring agents back after a restart</text>
  <text x="419" y="538" fill="#7d8089" font-size="12.5">Claude and Antigravity agents started through the launcher continue their conversation</text>
  <text x="419" y="556" fill="#7d8089" font-size="12.5">after a reboot or a logout.</text>
  <text x="419" y="576" fill="#a5a8ae" font-size="12">Also at the foot of Agent presets.</text>
  <rect x="1016" y="532.0" width="36" height="20" rx="10" fill="#5b8def"/><circle cx="1042" cy="542.0" r="8" fill="#fff"/>
  <rect x="419" y="592" width="633" height="1" fill="#303237"/>
  <text x="419" y="622" fill="#e8e9eb" font-size="14">Herdr guide for every agent</text>
  <rect x="1016" y="607" width="36" height="20" rx="10" fill="#5b8def"/><circle cx="1042" cy="617" r="8" fill="#fff"/>
