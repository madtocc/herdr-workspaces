  <text x="446" y="214" fill="#7d8089" font-size="11.5">What it does</text>
  <text x="446" y="238" fill="#e8e9eb" font-size="13">When a pull request is opened in any repo here by someone else · looks every 2 minutes</text>
  <text x="446" y="259" fill="#a5a8ae" font-size="12">Starts reviewer (claude) on sonnet, in its repo's folder · notifies on results.</text>
  <text x="446" y="289" fill="#7d8089" font-size="11.5">Prompt: the agent's task</text>
  <rect x="446" y="301" width="656" height="150" rx="7" fill="#17181b" stroke="#2f3137"/>
  <text x="458" y="325" fill="#e8e9eb" font-size="13">A pull request was just opened:</text>
  <text x="458" y="345" fill="#e8e9eb" font-size="13"></text>
  <text x="458" y="365" fill="#e8e9eb" font-size="13">{{pr}}</text>
  <text x="458" y="385" fill="#e8e9eb" font-size="13"></text>
  <text x="458" y="405" fill="#e8e9eb" font-size="13">Review it: read the change against what the pull request says it</text>
  <text x="458" y="425" fill="#e8e9eb" font-size="13">does, run the tests, and write what you would change. Don't push.</text>
  <text x="446" y="471" fill="#7d8089" font-size="11.5">Fill-ins: {{pr}} (number, title, author, link and description), {{number}} {{title}} {{url}} {{author}} {{repo}}</text>
