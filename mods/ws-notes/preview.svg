  <text x="561.0" y="180.0" fill="#7d8089" font-size="11.5" text-anchor="end">1d</text>
  <text x="307.0" y="199.0" fill="#7d8089" font-size="11.5">Every shortcut in one place; ? opens it.</text>
  <text x="307.0" y="234.0" fill="#e8e9eb" font-size="13" font-weight="500">Split the api's settings module</text>
  <text x="561.0" y="234.0" fill="#7d8089" font-size="11.5" text-anchor="end">3d</text>
  <text x="307.0" y="253.0" fill="#7d8089" font-size="11.5">settings.py is 2,000 lines: one file per section.</text>
