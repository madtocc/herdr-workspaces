  <text x="611.0" y="191.0" fill="#e8e9eb" font-size="13.5">Cache the web build</text>
  <text x="611.0" y="215.0" fill="#e8e9eb" font-size="13.5">CI spends about 9 minutes building web on every push, mostly the same packages.</text>
  <text x="611.0" y="263.0" fill="#e8e9eb" font-size="13.5">- turbo remote cache, or nx's?</text>
  <text x="611.0" y="287.0" fill="#e8e9eb" font-size="13.5">- where would the cache live: S3, or the CI's own?</text>
  <text x="611.0" y="311.0" fill="#e8e9eb" font-size="13.5">- check how often main's build is a cache hit today</text>
  <text x="611.0" y="359.0" fill="#e8e9eb" font-size="13.5">Worth a card once we know what CI spends.</text>
  <rect x="611.0" y="375.0" width="1.5" height="17" fill="#e8e9eb"/>
