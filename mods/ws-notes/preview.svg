  <!-- header: the workspace, how many notes, search, New note -->
  <rect x="305.0" y="63.0" width="20.0" height="20" rx="5" fill="#5b8def"/><text x="315.0" y="77.5" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">A</text>
  <text x="335.0" y="77.5" fill="#e8e9eb" font-size="13" font-weight="600">Acme notes</text>
  <text x="420.0" y="77.5" fill="#7d8089" font-size="12">5 notes</text>
  <rect x="1152.0" y="59.0" width="112.0" height="28" rx="7" fill="#ececed"/><g transform="translate(1163 66.5) scale(0.5417)" fill="none" stroke="#17181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14" /> <path d="M12 5v14" /></g><text x="1182.0" y="77.5" fill="#17181b" font-size="12" font-weight="500">New note</text>
  <rect x="922.0" y="59.0" width="220.0" height="28" rx="7" fill="#141518" stroke="#2f3137"/><g transform="translate(931 67) scale(0.5000)" fill="none" stroke="#7d8089" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></g><text x="950.0" y="77.3" fill="#7d8089" font-size="12">Search notes</text>
  <rect x="289.0" y="96.0" width="991.0" height="1" fill="#25272b"/>
  <!-- the list: newest edited first; the started mark counts the sessions started from a note -->
  <rect x="579.0" y="97.0" width="1" height="703" fill="#25272b"/>
  <rect x="297.0" y="105" width="274.0" height="52" rx="7" fill="#26272c"/>
  <text x="307.0" y="126.0" fill="#e8e9eb" font-size="13" font-weight="500">Cache the web build</text>
  <text x="561.0" y="126.0" fill="#7d8089" font-size="11.5" text-anchor="end">2h</text>
  <text x="307.0" y="145.0" fill="#7d8089" font-size="11.5">CI spends about 9 minutes building web on…</text>
  <text x="307.0" y="180.0" fill="#e8e9eb" font-size="13" font-weight="500">Keyboard shortcuts page for web</text>
  <text x="561.0" y="180.0" fill="#7d8089" font-size="11.5" text-anchor="end">1d</text>
  <text x="307.0" y="199.0" fill="#7d8089" font-size="11.5">Every shortcut in one place; ? opens it.</text>
  <text x="307.0" y="234.0" fill="#e8e9eb" font-size="13" font-weight="500">Split the api's settings module</text>
  <text x="561.0" y="234.0" fill="#7d8089" font-size="11.5" text-anchor="end">3d</text>
  <text x="307.0" y="253.0" fill="#7d8089" font-size="11.5">settings.py is 2,000 lines: one file per section.</text>
  <text x="307.0" y="288.0" fill="#e8e9eb" font-size="13" font-weight="500">A docs page per endpoint</text>
  <text x="561.0" y="288.0" fill="#7d8089" font-size="11.5" text-anchor="end">1w</text>
  <text x="307.0" y="307.0" fill="#7d8089" font-size="11.5">Generate them from the OpenAPI file?</text>
  <text x="307.0" y="342.0" fill="#e8e9eb" font-size="13" font-weight="500">Offline mode for the web app</text>
  <text x="561.0" y="342.0" fill="#7d8089" font-size="11.5" text-anchor="end">2w</text>
  <text x="307.0" y="361.0" fill="#7d8089" font-size="11.5">A service worker? Ask what breaks first.</text>
  <!-- the open note: its file, saved, and its actions -->
  <text x="596.0" y="125.0" fill="#7d8089" font-size="11.5">notes/2026-11-21-1105-cache-the-web-build.md</text>
  <rect x="1187.0" y="107.0" width="77.0" height="28" rx="7" fill="none" stroke="#2f3137"/>
  <g transform="translate(1198.0 114.5) scale(0.5417)" fill="none" stroke="#a5a8ae" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></g>
  <text x="1217.0" y="125.3" fill="#a5a8ae" font-size="12">Delete</text>
  <rect x="1036.0" y="107.0" width="143.0" height="28" rx="7" fill="#ececed"/>
  <g transform="translate(1047.0 114.5) scale(0.5417)" fill="none" stroke="#17181b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/><path d="M15 3v18"/><path d="M5.5 7h1.5"/><path d="M11.5 7h1.5"/><path d="M11.5 11h1.5"/><path d="M17.5 7h1"/></g>
  <text x="1066.0" y="125.3" fill="#17181b" font-size="12" font-weight="500">Move to the board</text>
  <text x="1024.0" y="125.3" fill="#7d8089" font-size="11.5" text-anchor="end">Saved</text>
  <rect x="580.0" y="145.0" width="700.0" height="1" fill="#25272b"/>
  <!-- the note: plain text, saved as you type; its first line is its title -->
  <rect x="596.0" y="161.0" width="668.0" height="623" rx="8" fill="#141518" stroke="#25272b"/>
  <text x="611.0" y="191.0" fill="#e8e9eb" font-size="13.5">Cache the web build</text>
  <text x="611.0" y="215.0" fill="#e8e9eb" font-size="13.5">CI spends about 9 minutes building web on every push, mostly the same packages.</text>
  <text x="611.0" y="263.0" fill="#e8e9eb" font-size="13.5">- turbo remote cache, or nx's?</text>
  <text x="611.0" y="287.0" fill="#e8e9eb" font-size="13.5">- where would the cache live: S3, or the CI's own?</text>
  <text x="611.0" y="311.0" fill="#e8e9eb" font-size="13.5">- check how often main's build is a cache hit today</text>
  <text x="611.0" y="359.0" fill="#e8e9eb" font-size="13.5">Worth a card once we know what CI spends.</text>
  <rect x="611.0" y="375.0" width="1.5" height="17" fill="#e8e9eb"/>
  </g>
</svg>
