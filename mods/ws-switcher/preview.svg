<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="800" viewBox="0 0 1280 800" font-family="Geist, -apple-system, 'Helvetica Neue', sans-serif">
  <!-- Workspaces: the Herdr layout with the workspace switcher open. Demo names only. -->
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1280" height="800" fill="#111215"/>

  <!-- sidebar -->
  <rect width="288" height="800" fill="#17181b"/>
  <rect x="288" width="1" height="800" fill="#25272b"/>
  <circle cx="20" cy="24" r="6" fill="#ff5f57"/><circle cx="40" cy="24" r="6" fill="#febc2e"/><circle cx="60" cy="24" r="6" fill="#28c840"/>
  <text x="124" y="30" fill="#e8e9eb" font-size="15" font-weight="600">Herdr</text>

  <!-- the switcher -->
  <rect x="10" y="60" width="268" height="40" rx="8" fill="#232428"/>
  <rect x="20" y="70" width="20" height="20" rx="5" fill="#5b8def"/>
  <text x="30" y="85" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">A</text>
  <text x="52" y="85" fill="#e8e9eb" font-size="14" font-weight="500">Acme</text>
  <circle cx="226" cy="80" r="3" fill="#e5534b"/>
  <text x="242" y="85" fill="#7d8089" font-size="11.5">3</text>
  <path d="M256 78 l4 4 l4 -4" stroke="#7d8089" stroke-width="1.5" fill="none"/>

  <!-- spaces -->
  <text x="19" y="128" fill="#7d8089" font-size="12">Spaces</text>
  <text x="256" y="129" fill="#7d8089" font-size="16">+</text>
  <rect x="10" y="144" width="268" height="34" rx="8" fill="#26272c"/>
  <rect x="20" y="152" width="18" height="18" rx="5" fill="#22a99a"/><text x="29" y="165" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">A</text>
  <text x="50" y="166" fill="#e8e9eb" font-size="14">api</text>
  <rect x="20" y="188" width="18" height="18" rx="5" fill="#e3814f"/><text x="29" y="201" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">W</text>
  <text x="50" y="202" fill="#e8e9eb" font-size="14">web</text><text x="268" y="202" fill="#7d8089" font-size="11.5" text-anchor="end">billing ↑2</text>
  <rect x="20" y="224" width="18" height="18" rx="5" fill="#8b7cf6"/><text x="29" y="237" fill="#fff" font-size="10.5" font-weight="700" text-anchor="middle">D</text>
  <text x="50" y="238" fill="#e8e9eb" font-size="14">docs</text>

  <!-- agents -->
  <rect y="420" width="288" height="1" fill="#25272b"/>
  <text x="19" y="454" fill="#7d8089" font-size="12">Agents</text>
  <text x="19" y="490" fill="#e5534b" font-size="12">Needs you 1</text>
  <rect x="10" y="500" width="268" height="34" rx="8" fill="#1f2024"/>
  <rect x="20" y="509" width="16" height="16" rx="4" fill="#d97757"/>
  <text x="46" y="522" fill="#e8e9eb" font-size="13.5">web</text><text x="80" y="522" fill="#7d8089" font-size="13">· Add billing page</text>
  <text x="19" y="562" fill="#7d8089" font-size="12">Working 1</text>
  <rect x="20" y="577" width="16" height="16" rx="4" fill="#d97757"/>
  <text x="46" y="590" fill="#e8e9eb" font-size="13.5">api</text><text x="74" y="590" fill="#7d8089" font-size="13">· Fix login redirect</text>
  <text x="19" y="764" fill="#a5a8ae" font-size="13">⚙  Settings</text>

  <!-- tab bar and pane -->
  <rect x="300" y="8" width="78" height="32" rx="8" fill="#26272c"/>
  <text x="330" y="29" fill="#e8e9eb" font-size="13">1</text>
  <text x="1110" y="29" fill="#a5a8ae" font-size="13">Files</text><text x="1182" y="29" fill="#a5a8ae" font-size="13">Changes</text>
  <rect x="300.5" y="56.5" width="969" height="735" rx="10" fill="#1b1c20" stroke="#8ab4f8"/>
  <rect x="301" y="57" width="968" height="34" rx="10" fill="#1d1e22"/>
  <text x="322" y="79" fill="#e8e9eb" font-size="13" font-weight="500">Claude Code</text>
  <text x="408" y="79" fill="#7d8089" font-size="12.5">~/work/acme/api</text>
  <g font-family="'JetBrains Mono', Menlo, monospace" font-size="15" fill="#c9ccd1">
    <text x="322" y="130">Read the workspace instructions: use pnpm, run make verify.</text>
    <text x="322" y="160" fill="#7d8089">● Reading src/auth/redirect.ts</text>
    <text x="322" y="190" fill="#7d8089">● Reading ../web/src/routes/login.tsx</text>
    <text x="322" y="230">The redirect drops the return path when the session</text>
    <text x="322" y="256">expires. I'll keep it in the login URL and restore it</text>
    <text x="322" y="282">after sign-in, in both api and web.</text>
    <text x="322" y="700" fill="#7d8089">❯</text>
  </g>

  <!-- the open switcher menu -->
  <g filter="url(#shadow)">
    <rect x="96" y="96" width="290" height="512" rx="10" fill="#202125" stroke="#303237"/>
  </g>
  <g font-size="13">
    <text x="112" y="122" fill="#7d8089" font-size="11">Workspaces</text>
    <rect x="109" y="134" width="18" height="18" rx="5" fill="none" stroke="#3a3c42"/>
    <text x="138" y="148" fill="#e8e9eb">All spaces</text><text x="356" y="148" fill="#7d8089" font-size="11" text-anchor="end">7</text>
    <rect x="101" y="160" width="280" height="30" rx="7" fill="#2a2b31"/>
    <rect x="109" y="166" width="18" height="18" rx="5" fill="#5b8def"/><text x="118" y="179" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">A</text>
    <text x="138" y="180" fill="#e8e9eb">Acme</text><text x="346" y="180" fill="#7d8089" font-size="11" text-anchor="end">3</text>
    <path d="M356 175 l3 3 l6 -6" stroke="#8ab4f8" stroke-width="1.6" fill="none"/>
    <rect x="109" y="196" width="18" height="18" rx="5" fill="#e3814f"/><text x="118" y="209" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">G</text>
    <text x="138" y="210" fill="#e8e9eb">Globex</text><circle cx="328" cy="206" r="3" fill="#e5534b"/><text x="346" y="210" fill="#7d8089" font-size="11" text-anchor="end">2</text>
    <rect x="109" y="226" width="18" height="18" rx="5" fill="#3fae6a"/><text x="118" y="239" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">I</text>
    <text x="138" y="240" fill="#e8e9eb">Initech</text><text x="346" y="240" fill="#7d8089" font-size="11" text-anchor="end">2</text>
    <rect x="100" y="256" width="282" height="1" fill="#303237"/>
    <text x="112" y="280" fill="#a5a8ae">◇</text><text x="138" y="280" fill="#e8e9eb">Move “api” to…</text><text x="362" y="280" fill="#7d8089" text-anchor="end">›</text>
    <text x="112" y="310" fill="#a5a8ae">＋</text><text x="138" y="310" fill="#e8e9eb">New workspace from a folder…</text>
    <text x="112" y="340" fill="#a5a8ae">▤</text><text x="138" y="340" fill="#e8e9eb">Open Acme's files</text>
    <text x="112" y="370" fill="#a5a8ae">✎</text><text x="138" y="370" fill="#e8e9eb">Rename Acme…</text>
    <text x="112" y="400" fill="#e5534b">⌫</text><text x="138" y="400" fill="#e5534b">Delete Acme…</text>
    <rect x="100" y="414" width="282" height="1" fill="#303237"/>
    <text x="112" y="438" fill="#7d8089" font-size="11">Acme folders</text>
    <text x="138" y="464" fill="#e8e9eb">api</text><text x="362" y="464" fill="#7d8089" font-size="11" text-anchor="end">Go</text>
    <text x="138" y="494" fill="#e8e9eb">web</text><text x="362" y="494" fill="#7d8089" font-size="11" text-anchor="end">Go</text>
    <text x="138" y="524" fill="#e8e9eb">docs</text><text x="362" y="524" fill="#7d8089" font-size="11" text-anchor="end">Go</text>
    <text x="138" y="554" fill="#e8e9eb">infra</text><text x="362" y="554" fill="#7d8089" font-size="11" text-anchor="end">Open</text>
    <text x="138" y="584" fill="#e8e9eb">design-system</text><text x="362" y="584" fill="#7d8089" font-size="11" text-anchor="end">Open</text>
    <g fill="none" stroke="#a5a8ae" stroke-width="1.2">
      <path d="M112 454 h5 l2 2 h8 v10 h-15 z"/><path d="M112 484 h5 l2 2 h8 v10 h-15 z"/><path d="M112 514 h5 l2 2 h8 v10 h-15 z"/>
      <path d="M112 544 h5 l2 2 h8 v10 h-15 z"/><path d="M112 574 h5 l2 2 h8 v10 h-15 z"/>
    </g>
  </g>
</svg>
