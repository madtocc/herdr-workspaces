    <rect x="109" y="234" width="18" height="18" rx="5" fill="#5b8def"/><text x="118" y="247" fill="#fff" font-size="10" font-weight="700" text-anchor="middle">A</text>
    <text x="138" y="248" fill="#e8e9eb">Acme</text><text x="346" y="248" fill="#7d8089" font-size="11" text-anchor="end">3</text>
