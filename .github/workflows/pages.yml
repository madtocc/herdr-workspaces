# Publishes the two installers at https://madtocc.github.io/herdr-workspaces/,
# so the install line in the README is short. Only install.sh, install.ps1 and
# a page that sends a browser on to the repo are published there, each time one
# of the installers changes on main.
name: Publish the installers

on:
  push:
    branches: [main]
    paths: [install.sh, install.ps1, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Put the site together
        run: |
          mkdir _site
          cp install.sh install.ps1 _site/
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Workspaces for Herdr</title>
          <meta http-equiv="refresh" content="0; url=https://github.com/${{ github.repository }}#install">
          <p>Workspaces for Herdr is at <a href="https://github.com/${{ github.repository }}#install">github.com/${{ github.repository }}</a>.</p>
          HTML
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
